<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Réponse enregistrée — Bump</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
      color: #1a202c;
    }
    main {
      width: min(100% - 2rem, 28rem);
      background: #fff;
      border-radius: 1rem;
      padding: 2rem 1.5rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.35rem;
      line-height: 1.3;
    }
    p {
      margin: 0 0 1.25rem;
      color: #64748b;
      line-height: 1.55;
      font-size: 0.98rem;
    }
    .logo {
      display: inline-block;
      margin-bottom: 1rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #e53e3e;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 0.75rem;
      padding: 0.85rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      background: #e53e3e;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Bump Charge</div>
    <h1 id="title">Confirmation</h1>
    <p id="detail">Chargement…</p>
    <button id="confirmBtn" class="hidden" type="button">Confirmer ma réponse</button>
  </main>

  <script>
    const WEBHOOK_URL =
      "https://bumpcharge.retool.com/url/pdp-webhook?workflowApiKey=retool_wk_cf0ace94fc314784a9ca5069f166c643";

    const title = document.getElementById("title");
    const detail = document.getElementById("detail");
    const confirmBtn = document.getElementById("confirmBtn");

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const choix = params.get("choix");
    const sig = params.get("sig");
    const client_nom = params.get("client_nom") || "";
    const date_expiration = params.get("date_expiration") || "";

    const dedupeKey =
      id && choix && sig ? `pdp-reponse-sent-${id}-${choix}-${sig}` : null;

    let sending = false;

    function show(okTitle, okDetail, showButton) {
      title.textContent = okTitle;
      detail.textContent = okDetail;
      confirmBtn.classList.toggle("hidden", !showButton);
    }

    function successMessage() {
      if (choix === "OUI") {
        show(
          "Réponse prise en compte",
          "Merci, votre demande de renouvellement a bien été enregistrée. Nos équipes vont vous recontacter.",
          false
        );
      } else {
        show(
          "Réponse prise en compte",
          "Merci, nous avons bien enregistré que vous ne souhaitez pas renouveler.",
          false
        );
      }
    }

    function buildWebhookUrl() {
      const url = new URL(WEBHOOK_URL);
      url.searchParams.set("id", String(id));
      url.searchParams.set("choix", choix);
      url.searchParams.set("sig", sig);
      url.searchParams.set("client_nom", client_nom);
      url.searchParams.set("date_expiration", date_expiration);
      return url.toString();
    }

    async function sendOnce() {
      if (!dedupeKey || sending) return;
      if (sessionStorage.getItem(dedupeKey)) {
        successMessage();
        return;
      }

      // Verrouille AVANT l'appel pour éviter un double envoi
      sending = true;
      sessionStorage.setItem(dedupeKey, "1");
      confirmBtn.disabled = true;
      confirmBtn.textContent = "Envoi…";

      try {
        await fetch(buildWebhookUrl(), {
          method: "GET",
          mode: "no-cors",
          cache: "no-store",
        });
      } catch (_) {
        // no-cors / réseau : l'idempotence SQL côté webhook couvre les doublons
      }

      successMessage();
    }

    function init() {
      if (!id || !choix || !sig || (choix !== "OUI" && choix !== "NON")) {
        show("Lien invalide", "Ce lien de réponse est incomplet ou incorrect.", false);
        return;
      }

      if (sessionStorage.getItem(dedupeKey)) {
        successMessage();
        return;
      }

      // Pas d'appel auto : évite le double trigger (préchargement mail + clic).
      show(
        choix === "OUI" ? "Confirmer le renouvellement" : "Confirmer votre refus",
        choix === "OUI"
          ? "Vous avez choisi de renouveler votre plan de prévention. Cliquez ci-dessous pour valider."
          : "Vous avez choisi de ne pas renouveler. Cliquez ci-dessous pour valider.",
        true
      );
      confirmBtn.addEventListener("click", sendOnce, { once: true });
    }

    init();
  </script>
</body>
</html>
